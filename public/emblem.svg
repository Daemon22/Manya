<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E3A2"/>
      <stop offset="0.35" stop-color="#E8C96A"/>
      <stop offset="0.65" stop-color="#B08A2E"/>
      <stop offset="1" stop-color="#E3C56C"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FB8F8"/>
      <stop offset="0.5" stop-color="#3D7BE8"/>
      <stop offset="1" stop-color="#1E4FB4"/>
    </linearGradient>
    <radialGradient id="bead" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#F6E3A2"/>
      <stop offset="1" stop-color="#9C7A26"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0B0A08"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#ring)" stroke-width="3.2"/>
  <circle cx="32" cy="32" r="17.5" fill="none" stroke="url(#ring)" stroke-width="0.9" opacity="0.7"/>
  <!-- top gem -->
  <path d="M32 4 L38 10 L32 16 L26 10 Z" fill="url(#gem)" stroke="#D9B95C" stroke-width="1"/>
  <path d="M32 4 L32 16 M26 10 L38 10" stroke="#BFE0FF" stroke-width="0.7" opacity="0.8"/>
  <!-- bottom gem -->
  <path d="M32 48 L38 54 L32 60 L26 54 Z" fill="url(#gem)" stroke="#D9B95C" stroke-width="1"/>
  <!-- side beads -->
  <circle cx="7.5" cy="32" r="3.4" fill="url(#bead)"/>
  <circle cx="56.5" cy="32" r="3.4" fill="url(#bead)"/>
  <!-- clasp: two interlocking strokes (hands) -->
  <path d="M24 37 C27 33.5 30 32.5 32 33.5 L38 36.5 C35.5 39.5 30 40.5 26 39" fill="none" stroke="url(#ring)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M40 27.5 C37 31 34 32 32 31 L27.5 29 C29.5 26 35 25 38.5 26.5" fill="none" stroke="#F2E4B8" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
</svg>
